databases:
  - name: meta-crm-db
    plan: free
    region: oregon

services:
  - type: web
    name: meta-crm-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: meta-crm-db
          property: connectionString
      - key: MASTER_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://meta-crm-frontend.onrender.com
      - key: META_APP_ID
        value: ""
      - key: META_APP_SECRET
        value: ""
      - key: META_ACCESS_TOKEN
        value: ""
      - key: META_PIXEL_ID
        value: ""
      - key: META_GRAPH_API_VERSION
        value: "v19.0"
      - key: DEMO_MODE
        value: "false"

  - type: static-site
    name: meta-crm-frontend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build --workspace=client
    publishDirectory: ./client/dist
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_BASE_URL
        value: https://meta-crm-api.onrender.com/api
